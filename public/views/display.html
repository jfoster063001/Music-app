<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Clash Display</title>
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/display/display.css">
</head>
<body>
  <main class="display-shell">
    <header class="display-header">
      <p class="eyebrow">LIVE MUSIC TOURNAMENT</p>
      <h1 id="tournamentName">SONG CLASH</h1>
      <p id="stateText" class="display-state">Waiting…</p>
    </header>

    <section id="countdownPanel" class="countdown-panel hidden" aria-live="polite">
      <p id="countdownLabel">GET READY</p>
      <strong id="countdownValue">3</strong>
    </section>

    <section id="matchupPanel" class="display-matchup">
      <article id="displaySongACard" class="display-song-card">
        <p>SONG A</p>
        <h2 id="songA">—</h2>
      </article>

      <div class="display-vs">VS</div>

      <article id="displaySongBCard" class="display-song-card">
        <p>SONG B</p>
        <h2 id="songB">—</h2>
      </article>
    </section>

    <section id="votingBanner" class="voting-banner hidden">
      <div>
        <p class="eyebrow">VOTING OPEN</p>
        <h2>Vote now</h2>
      </div>
      <strong id="votingTimer">30</strong>
    </section>

    <p id="voteProgress" class="vote-progress"></p>

    <section id="resultsPanel" class="results-panel hidden">
      <p class="eyebrow">RESULTS</p>
      <h2>Votes are in</h2>

      <div class="result-grid">
        <article class="result-card">
          <h3 id="resultATitle">Song A</h3>
          <div class="result-track">
            <div id="resultABar" class="result-bar"></div>
          </div>
          <div class="result-numbers">
            <strong id="resultACount">0</strong>
            <span id="resultAPercent">0%</span>
          </div>
        </article>

        <article class="result-card">
          <h3 id="resultBTitle">Song B</h3>
          <div class="result-track">
            <div id="resultBBar" class="result-bar"></div>
          </div>
          <div class="result-numbers">
            <strong id="resultBCount">0</strong>
            <span id="resultBPercent">0%</span>
          </div>
        </article>
      </div>

      <p id="resultWinner" class="result-winner"></p>
    </section>

    <section id="standings" class="standings"></section>

    <footer>
      Vote at <strong>/voting</strong>
    </footer>
  </main>

  <script type="module" src="/js/display/display.js"></script>
</body>
</html>
